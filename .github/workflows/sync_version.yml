name: Auto-Sync Version to Website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Version Tag for testing'
        required: true
        default: '2.2.0'
      test_notes:
        description: 'What is new (release notes)'
        required: false
        default: 'Test sync from GitHub Action'

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website Repository
        uses: actions/checkout@v4
        with:
          repository: dipakmeshram26/privaguard-website
          token: ${{ secrets.SYNC_TOKEN }}
          path: website

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Release Info to version.json
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          from datetime import datetime

          # Get tag from release event or manual dispatch input
          tag = os.environ.get('RELEASE_TAG', '') or os.environ.get('MANUAL_TAG', '')
          tag = tag.lstrip('v').strip()
          
          body = os.environ.get('RELEASE_BODY', '') or os.environ.get('MANUAL_NOTES', '')
          
          notes = []
          for line in body.splitlines():
              line = line.strip()
              clean_line = re.sub(r'^[-*•]\s*|^\d+\.\s*', '', line).strip()
              if clean_line:
                  notes.append(clean_line)

          file_path = 'website/version.json'
          with open(file_path, 'r', encoding='utf-8') as f:
              data = json.load(f)

          if tag:
              data['latest_version'] = tag
          
          data['release_date'] = datetime.now().strftime('%Y-%m-%d')
          
          if notes:
              data['whats_new'] = notes[:5]

          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)

          print(f"Successfully updated version.json to version: {data['latest_version']}")
          print(f"What's new: {data['whats_new']}")
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_TAG: ${{ github.event.inputs.test_tag }}
          MANUAL_NOTES: ${{ github.event.inputs.test_notes }}

      - name: Commit and Push Changes to Website
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff-index --quiet HEAD || git commit -m "Auto-update version.json to ${{ github.event.release.tag_name || github.event.inputs.test_tag }} [skip ci]"
          git push origin main
